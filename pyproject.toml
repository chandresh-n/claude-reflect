[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-reflect"
version = "0.1.0"
description = "Reflective analysis tool for Claude Code: reads session logs, identifies recurring patterns, and proposes configuration changes for you to review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Chandresh Naghera" },
]
keywords = ["claude-code", "anthropic", "llm-tools", "self-improvement", "agent-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/chandresh-n/claude-reflect"
Repository = "https://github.com/chandresh-n/claude-reflect"
Issues = "https://github.com/chandresh-n/claude-reflect/issues"

[project.scripts]
claude-reflect = "claude_reflect.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
