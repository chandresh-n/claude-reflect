[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
]

[project.scripts]
meta-harness = "meta_harness.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
